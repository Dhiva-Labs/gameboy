# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh, in-container.sh and packaging/arch/aur.sh.

NAME=gameboy
APP_NAME=gameboy             # AppImage file name
GITHUB_REPO=Dhiva-Labs/gameboy
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Game Boy (DMG) emulator with an SDL2 frontend'
DESCRIPTION='A Game Boy (DMG) emulator in C++20 with an SDL2 window, audio and keyboard controls, validated against blargg'"'"'s test ROMs and dmg-acid2. Run it with a ROM: gameboy game.gb.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/gameboy
# The repository has no license file yet. NOASSERTION is the SPDX value for
# "no license stated"; change it (and set LICENSE_FILE) once it has one.
LICENSE=NOASSERTION
LICENSE_FILE=

# rpm: shared-library dependencies (SDL2, libstdc++) are worked out from the
# ELF file. gameboy runs no other programs.
RPM_REQUIRES=()
# Arch: sdl2 is provided by sdl2-compat on current Arch.
ARCH_DEPENDS=(sdl2 gcc-libs glibc)
ARCH_INDEPENDENT=0

# AppImage: SDL2 comes from the host, like GTK does for GTK AppImages
# (APPIMAGE_HOST_PKGS is what the Fedora check installs as "the host").
APPIMAGE=1
EXEC=usr/bin/gameboy
DESKTOP=usr/share/applications/gameboy.desktop
ICON=usr/share/icons/hicolor/256x256/apps/gameboy.png
APPRUN_ENV=''
APPIMAGE_HOST_PKGS=('libSDL2-2.0.so.0()(64bit)')

# Smoke tests, run in each distribution container by in-container.sh as shell
# commands (for the AppImage, `gameboy` is the AppImage). /smoke holds the
# test ROMs (tests/roms/fetch_roms.sh, mounted by verify.sh).
# GUI: the real X11 window under Xvfb, still running after SMOKE_SECONDS.
GUI_CMD='gameboy --mute /smoke/dmg-acid2.gb'
SMOKE_SECONDS=20
# CLI: the repository's own frontend smoke test (tests/run_tests.sh): SDL's
# dummy video and audio drivers, 120 frames, and no error or warning output.
SMOKE_CMD='out="$(SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy gameboy --scale 1 --frames 120 /smoke/dmg-acid2.gb 2>&1)"; printf "%s\n" "$out"; if grep -qiE "CPU stopped|error|warning" <<< "$out"; then exit 1; fi'
